name: Tests

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Every suite here is offline. Empty keys make any stray live call fail
      # instead of reaching Groq or Hugging Face.
      GROQ_API_KEY: ""
      GROQ_API_KEYS: ""
      HF_TOKEN: ""
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch: sentence-transformers otherwise pulls the CUDA build.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          echo "chromadb=$(python -c 'import chromadb; print(chromadb.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/chroma
          key: models-all-MiniLM-L6-v2

      # data/chromadb is gitignored, so the index is built here and reused
      # until the chunks, the build script or the chromadb release change.
      - name: Cache ChromaDB index
        id: index-cache
        uses: actions/cache@v4
        with:
          path: data/chromadb
          key: chromadb-${{ steps.install.outputs.chromadb }}-${{ hashFiles('data/extracted_json/ncert_chunks.json', 'scripts/load_chromadb.py') }}

      - name: Build ChromaDB index
        if: steps.index-cache.outputs.cache-hit != 'true'
        run: python scripts/load_chromadb.py

      - name: frontend.test_app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m frontend.test_app

      - name: scripts.llm.test_pipeline
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m scripts.llm.test_pipeline

      - name: eval.controller_walk
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m eval.controller_walk

      - name: eval.validate_datasets
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m eval.validate_datasets

      - name: scripts.test_retrieval
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m scripts.test_retrieval

      - name: scripts.llm.test_scope
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m scripts.llm.test_scope

      - name: eval.test_answer_extraction
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m eval.test_answer_extraction

      - name: eval.component_eval.test_component_eval
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m eval.component_eval.test_component_eval
